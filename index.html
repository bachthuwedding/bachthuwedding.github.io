<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#ead5ad" />
  <meta name="description" content="Thiệp cưới Bách & Thư" />

  <title>Bách & Thư</title>

  <!-- =====================================
       FIRST SCREEN PRELOAD
       Chỉ tải 2 asset cần nhìn thấy ngay
  ====================================== -->

  <link
    rel="preload"
    href="./assets/page01-bg.webp"
    as="image"
    type="image/webp"
    fetchpriority="high"
  />

  <link
    rel="preload"
    href="./assets/envelope-closed.png"
    as="image"
    type="image/png"
    fetchpriority="high"
  />

  <link
    rel="stylesheet"
    href="./styles.css"
  />
</head>


<body>

  <main
    class="site-shell"
    id="siteShell"
  >

    <!-- =====================================
         PAGE 01
    ====================================== -->

    <section
      class="opening-page"
      id="opening"
      aria-label="Mở thiệp cưới Bách và Thư"
    >

      <button
        class="envelope-button"
        id="envelopeButton"
        type="button"
        aria-label="Mở thiệp"
        aria-expanded="false"
      >

        <span
          class="envelope-stage"
          aria-hidden="true"
        >

          <!-- =========================
               OPEN STATE

               Không có src ban đầu.
               JS sẽ tải sau first screen.
          ========================== -->

          <span class="envelope-open">

            <!-- NẮP MỞ PHÍA SAU -->
            <img
              class="envelope-open-flap deferred-opening-asset"
              data-src="./assets/envelope-open-flap.png"
              alt=""
              draggable="false"
              decoding="async"
              width="900"
              height="600"
            />


            <!-- THÂN PHONG BÌ PHÍA SAU -->
            <img
              class="envelope-open-body deferred-opening-asset"
              data-src="./assets/envelope-open-body.png"
              alt=""
              draggable="false"
              decoding="async"
              width="800"
              height="1200"
            />


            <!-- TỜ THIỆP -->
            <img
              class="invitation-card deferred-opening-asset"
              id="invitationCard"
              data-src="./assets/invitation-card.png"
              alt=""
              draggable="false"
              decoding="async"
              width="720"
              height="960"
            />


            <!-- MẶT TRƯỚC PHONG BÌ -->
            <img
              class="envelope-open-front deferred-opening-asset"
              data-src="./assets/envelope-open-front.png"
              alt=""
              draggable="false"
              decoding="async"
              width="800"
              height="1200"
            />

          </span>


          <!-- =========================
               CLOSED STATE
               Asset cần tải ngay
          ========================== -->

          <img
            class="envelope-closed"
            src="./assets/envelope-closed.png"
            alt=""
            draggable="false"
            loading="eager"
            decoding="async"
            fetchpriority="high"
            width="800"
            height="1200"
          />


          <!-- TAP HINT -->

          <span class="monogram-pulse"></span>

        </span>

      </button>

    </section>


    <!-- =====================================
         PAGE 02
         Tạm để trống.
         Mình sẽ thiết kế riêng sau.
    ====================================== -->

    <section
      class="page-02"
      id="page02"
      aria-hidden="true"
    >
    </section>

  </main>


  <script src="./script.js"></script>

</body>

</html>
