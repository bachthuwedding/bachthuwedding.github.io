<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ead5ad" />
  <meta name="description" content="Thiệp cưới Bách & Thư" />
  <title>Bách & Thư</title>
  <link rel="preload" href="./assets/page01-bg.webp" as="image" type="image/webp" />
<link rel="preload" href="./assets/envelope-closed.png" as="image" type="image/png" />
<link rel="preload" href="./assets/envelope-open-body.png" as="image" type="image/png" />
<link rel="preload" href="./assets/envelope-open-flap.png" as="image" type="image/png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="site-shell">
    <section class="opening-page" id="opening" aria-label="Mở thiệp cưới Bách và Thư">
      <button
  class="envelope-button"
  id="envelopeButton"
  type="button"
  aria-label="Mở thiệp"
  aria-expanded="false"
>

  <span class="envelope-stage" aria-hidden="true">


    <!-- =========================
         OPEN STATE
    ========================== -->

    <span class="envelope-open">

      <!--
        Nắp nằm phía SAU thân phong bao
      -->

      <img
        class="envelope-open-flap"
        src="./assets/envelope-open-flap.png"
        alt=""
        draggable="false"
      />


      <!--
        Thân phong bao nằm phía TRƯỚC
      -->

      <img
        class="envelope-open-body"
        src="./assets/envelope-open-body.png"
        alt=""
        draggable="false"
      />

    </span>


    <!-- =========================
         CLOSED STATE
    ========================== -->

    <img
      class="envelope-closed"
      src="./assets/envelope-closed.png"
      alt=""
      draggable="false"
    />


    <!-- TAP HINT -->

    <span class="monogram-pulse"></span>

  </span>

</button>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
