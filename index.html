<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#ead5ad" />
  <meta name="description" content="Thiệp cưới Bách & Thư" />

  <title>Bách & Thư</title>

  <!-- Chỉ preload những asset cần nhìn thấy ngay -->
  <link
    rel="preload"
    href="./assets/page01-bg-optimized.webp"
    as="image"
    type="image/webp"
    fetchpriority="high"
  />

  <link
    rel="preload"
    href="./assets/envelope-closed-optimized.png"
    as="image"
    type="image/png"
    fetchpriority="high"
  />

  <link rel="stylesheet" href="./styles.css" />
</head>


<body>

  <main
    class="site-shell"
    id="siteShell"
  >

    <!-- =====================================
         PAGE 01
    ====================================== -->

    <section
      class="opening-page"
      id="opening"
      aria-label="Mở thiệp cưới Bách và Thư"
    >

      <button
        class="envelope-button"
        id="envelopeButton"
        type="button"
        aria-label="Mở thiệp"
        aria-expanded="false"
      >

        <span
          class="envelope-stage"
          aria-hidden="true"
        >

          <!-- =========================
               OPEN STATE
               Các ảnh này tải sau
          ========================== -->

          <span class="envelope-open">

            <!-- Nắp phía sau -->
            <img
              class="envelope-open-flap deferred-opening-asset"
              data-src="./assets/envelope-open-flap-optimized.png"
              alt=""
              draggable="false"
              decoding="async"
              width="900"
              height="600"
            />


            <!-- Thân phía sau -->
            <img
              class="envelope-open-body deferred-opening-asset"
              data-src="./assets/envelope-open-body-optimized.png"
              alt=""
              draggable="false"
              decoding="async"
              width="800"
              height="1200"
            />


            <!-- Tờ giấy -->
            <img
              class="invitation-card deferred-opening-asset"
              id="invitationCard"
              data-src="./assets/invitation-card-optimized.png"
              alt=""
              draggable="false"
              decoding="async"
              width="720"
              height="960"
            />


            <!-- Mặt trước phong bì -->
            <img
              class="envelope-open-front deferred-opening-asset"
              data-src="./assets/envelope-open-front-optimized.png"
              alt=""
              draggable="false"
              decoding="async"
              width="800"
              height="1200"
            />

          </span>


          <!-- =========================
               CLOSED STATE
          ========================== -->

          <img
            class="envelope-closed"
            src="./assets/envelope-closed-optimized.png"
            alt=""
            draggable="false"
            loading="eager"
            decoding="async"
            fetchpriority="high"
            width="800"
            height="1200"
          />


          <!-- TAP HINT -->
          <span class="monogram-pulse"></span>

        </span>

      </button>

    </section>


    <!-- =====================================
         PAGE 02+
         Scroll area chung cho invitation
    ====================================== -->

    <section
      class="page-02"
      id="page02"
      aria-hidden="true"
    >

      <div class="invitation-flow">

        <!--
          KHUNG CHUNG

          Khung này thuộc invitation-flow,
          KHÔNG thuộc riêng Page 02.

          Khi thêm Page 03, Page 04...
          hãy đặt các section mới bên dưới
          page02-layout trong invitation-flow.
        -->
        <div
          class="shared-invitation-frame"
          aria-hidden="true"
        ></div>


        <!-- =================================
             PAGE 02 CONTENT
        ================================== -->

        <section
          class="invitation-page page02-layout"
          aria-label="Lễ thành hôn Bách và Thư"
        >

          <!-- =================================
               CLOUDS
               4 cloud được crop từ 1 sprite
          ================================== -->

          <span
            class="p02-cloud p02-cloud--01"
            aria-hidden="true"
          >
            <img
              class="p02-cloud-sprite deferred-page02-asset"
              data-src="./assets/page02-clouds.png"
              alt=""
              draggable="false"
              decoding="async"
              width="1254"
              height="1254"
            />
          </span>


          <span
            class="p02-cloud p02-cloud--02"
            aria-hidden="true"
          >
            <img
              class="p02-cloud-sprite deferred-page02-asset"
              data-src="./assets/page02-clouds.png"
              alt=""
              draggable="false"
              decoding="async"
              width="1254"
              height="1254"
            />
          </span>


          <span
            class="p02-cloud p02-cloud--03"
            aria-hidden="true"
          >
            <img
              class="p02-cloud-sprite deferred-page02-asset"
              data-src="./assets/page02-clouds.png"
              alt=""
              draggable="false"
              decoding="async"
              width="1254"
              height="1254"
            />
          </span>


          <span
            class="p02-cloud p02-cloud--04"
            aria-hidden="true"
          >
            <img
              class="p02-cloud-sprite deferred-page02-asset"
              data-src="./assets/page02-clouds.png"
              alt=""
              draggable="false"
              decoding="async"
              width="1254"
              height="1254"
            />
          </span>


          <!-- =================================
               BAMBOO
          ================================== -->

          <img
            class="
              p02-asset
              p02-bamboo
              p02-bamboo-left
              deferred-page02-asset
            "
            data-src="./assets/page02-bamboo-left.png"
            alt=""
            draggable="false"
            decoding="async"
            width="682"
            height="2048"
          />


          <img
            class="
              p02-asset
              p02-bamboo
              p02-bamboo-right
              deferred-page02-asset
            "
            data-src="./assets/page02-bamboo-right.png"
            alt=""
            draggable="false"
            decoding="async"
            width="682"
            height="2048"
          />


          <!-- =================================
               TEXT
          ================================== -->

          <p class="p02-invite">
            TRÂN TRỌNG KÍNH MỜI
          </p>


          <div
            class="p02-divider"
            aria-hidden="true"
          ></div>


          <p class="p02-to">
            TỚI
          </p>


          <p class="p02-wedding-title">
            LỄ THÀNH HÔN
          </p>


          <h1 class="p02-couple-names">

            <span class="p02-name">
              BÁCH
            </span>

            <span class="p02-ampersand">
              &amp;
            </span>

            <span class="p02-name">
              THƯ
            </span>

          </h1>


          <p class="p02-date">
            24.11.2026
          </p>


          <div
            class="p02-date-divider"
            aria-hidden="true"
          ></div>


          <!-- =================================
               FLOWERS / PETALS
          ================================== -->

          <img
            class="
              p02-asset
              p02-flowers
              deferred-page02-asset
            "
            data-src="./assets/page02-flowers.png"
            alt=""
            draggable="false"
            decoding="async"
            width="1254"
            height="1254"
          />


          <!-- =================================
               PROCESSION
          ================================== -->

          <img
            class="
              p02-asset
              p02-flag-bearer
              deferred-page02-asset
            "
            data-src="./assets/page02-flag-bearer.png"
            alt=""
            draggable="false"
            decoding="async"
            width="1024"
            height="1536"
          />


          <!--
            CHỈ DÙNG ẢNH CÔ DÂU CHÚ RỂ ĐẦU TIÊN
          -->
          <img
            class="
              p02-asset
              p02-couple
              deferred-page02-asset
            "
            data-src="./assets/page02-couple.png"
            alt=""
            draggable="false"
            decoding="async"
            width="1024"
            height="1536"
          />


          <img
            class="
              p02-asset
              p02-lion-dance
              deferred-page02-asset
            "
            data-src="./assets/page02-lion-dance.png"
            alt=""
            draggable="false"
            decoding="async"
            width="1448"
            height="1086"
          />


          <img
            class="
              p02-asset
              p02-drummer
              deferred-page02-asset
            "
            data-src="./assets/page02-drummer.png"
            alt=""
            draggable="false"
            decoding="async"
            width="1024"
            height="1536"
          />


          <!-- =================================
               BOTTOM ORNAMENT
          ================================== -->

          <img
            class="
              p02-asset
              p02-bottom-ornament
              deferred-page02-asset
            "
            data-src="./assets/page02-bottom-ornament.png"
            alt=""
            draggable="false"
            decoding="async"
            width="2048"
            height="682"
          />

        </section>

      </div>

    </section>

  </main>


  <script src="./script.js"></script>

</body>

</html>
