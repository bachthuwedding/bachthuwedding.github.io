<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#ead5ad" />
  <meta name="description" content="Thiệp cưới Bách & Thư" />

  <title>Bách & Thư</title>

  <!-- Preload các asset của Page 01 -->
  <link
    rel="preload"
    href="./assets/page01-bg.webp"
    as="image"
    type="image/webp"
  />

  <link
    rel="preload"
    href="./assets/envelope-closed.png"
    as="image"
    type="image/png"
  />

  <link
    rel="preload"
    href="./assets/envelope-open-body.png"
    as="image"
    type="image/png"
  />

  <link
    rel="preload"
    href="./assets/envelope-open-flap.png"
    as="image"
    type="image/png"
  />

  <link
    rel="preload"
    href="./assets/envelope-open-front.png"
    as="image"
    type="image/png"
  />

  <!-- preload tờ giấy để khi bấm mở không phải chờ -->
  <link
    rel="preload"
    href="./assets/invitation-card.png"
    as="image"
    type="image/png"
  />

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

  <main class="site-shell">

    <section
      class="opening-page"
      id="opening"
      aria-label="Mở thiệp cưới Bách và Thư"
    >

      <button
        class="envelope-button"
        id="envelopeButton"
        type="button"
        aria-label="Mở thiệp"
        aria-expanded="false"
      >

        <span
          class="envelope-stage"
          aria-hidden="true"
        >

          <!-- =========================
               OPEN STATE
          ========================== -->

          <span class="envelope-open">

            <!-- Nắp phía sau -->
            <img
              class="envelope-open-flap"
              src="./assets/envelope-open-flap.png"
              alt=""
              draggable="false"
              decoding="async"
            />

            <!-- Thân phong bì phía sau -->
            <img
              class="envelope-open-body"
              src="./assets/envelope-open-body.png"
              alt=""
              draggable="false"
              decoding="async"
            />

            <!-- TỜ GIẤY PNG -->
            <img
              class="invitation-card"
              src="./assets/invitation-card.png"
              alt=""
              draggable="false"
              decoding="async"
              fetchpriority="high"
              width="900"
              height="1200"
            />

            <!-- Mặt trước phong bì
                 nằm trên tờ giấy -->
            <img
              class="envelope-open-front"
              src="./assets/envelope-open-front.png"
              alt=""
              draggable="false"
              decoding="async"
            />

          </span>


          <!-- =========================
               CLOSED STATE
          ========================== -->

          <img
            class="envelope-closed"
            src="./assets/envelope-closed.png"
            alt=""
            draggable="false"
            decoding="async"
          />


          <!-- TAP HINT -->

          <span class="monogram-pulse"></span>

        </span>

      </button>

    </section>

  </main>

  <script src="./script.js"></script>

</body>
</html>
